name = "Qwen3-VL 2B — vision, image/video description"
description = """
Qwen3-VL 2B Instruct — small, fast vision-language model dedicated for
image/video frame description.
~1.6 GB model (Q8_0) + ~1.4 GB mmproj. 2B params, 262k native context.
Best for: frame-level video description (whisper-transcribe /api/describe),
image captioning, simple OCR. Tiny VRAM footprint coexists with the LLM
hot-swap and leaves headroom for ComfyUI / training jobs.

Lightweight alternative for the whisper-transcribe bot's VLM fallback on
silent / sparse-speech videos. NOTE: whisper-transcribe currently defaults
`LLM_VISION_MODEL=gemma-4-26B-A4B-it-Q4_K_M` (the `summarizer` preset) for
both vision and synthesis. To run frame description on this tiny 2B model
instead, set `LLM_VISION_MODEL=Qwen3-VL-2B-Instruct-Q8_0` in the bot env —
that string is this preset's model_id (the GGUF filename minus `.gguf`),
which is what the proxy advertises in `/v1/models`.
Q8 quant on a 2B model is effectively lossless for description tasks; no
need for Q4 here.

32k context is plenty for one image + the description prompt; saves KV cache
vs the 262k native context.
"""
vram_gb = 4.5

[model]
repo = "ggml-org/Qwen3-VL-2B-Instruct-GGUF"
file = "Qwen3-VL-2B-Instruct-Q8_0.gguf"

[mmproj]
url = "https://huggingface.co/ggml-org/Qwen3-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen3-VL-2B-Instruct-Q8_0.gguf"

[runtime]
context_size = 32768
temperature = 0.3
top_p = 0.95
top_k = 20
min_p = 0.05
