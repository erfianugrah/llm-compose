name = "Qwen3.8 27B Dense - froggeric fixed template (testing)"
description = """
Test preset: identical to qwen38 daily driver but with froggeric/Qwen-Fixed-Chat-Templates
v22.3. Fixes: empty-think poisoning, tool-call crash on JSON-string args, mid-dialogue
system-message drops, hallucinated user instructions during thinking, chronological
thought preservation for KV prefix caching.

If this passes smoke, it becomes the daily driver and the official Jinja template is retired.
Hardlinked GGUF from qwen38 (dedup by model_id stem).
"""
vram_gb = 21.0

capabilities = ["vision", "code"]

[model]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M-fixed.gguf"

[mmproj]
file = "qwen38-mmproj.gguf"

[template]
file = "qwen38-fixed.jinja"

[runtime]
reasoning = "on"
context_size = 196608
parallel_slots = 1
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
reasoning_effort = "medium"

[bench]
tokenizer = "unsloth/Qwen3.8-27B-GGUF"