name = "Qwen3.8 27B Dense - no speculative decoding (A/B control)"
description = """
A/B control variant of qwen38: identical except NO spec_type (MTP off).
Exists to isolate the 2026-08-18 decode-degradation bug: on b10362 AND
b10472, decode collapses to ~0.5 tok/s after ~10 min of agentic task
churn with MTP on (pp + draft acceptance stay healthy, GPU idles).
If this control sustains healthy decode through the same churn, the
degradation lives in the MTP draft path.
Hardlinked GGUF (presets dedup by model_id stem).
"""
vram_gb = 21.0

capabilities = ["vision", "code"]

[model]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M-nospec.gguf"

[mmproj]
file = "qwen38-mmproj.gguf"

[template]
file = "qwen38-fixed.jinja"

[runtime]
reasoning = "on"
context_size = 196608
parallel_slots = 2
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[bench]
tokenizer = "unsloth/Qwen3.8-27B-GGUF"
