name = "Qwen3.5 9B - gumshoe incumbent (small-track baseline)"
description = """
Qwen3.5 9B - the gumshoe research-agent incumbent (runs on servarr 1070 in
production). Local copy for the small-track quality A/B (plan section 8).
reasoning off mirrors production (gumshoe forces thinking off).
"""
vram_gb = 7.0

[model]
repo = "unsloth/Qwen3.5-9B-GGUF"
file = "Qwen3.5-9B-Q4_K_M.gguf"

[runtime]
reasoning = "off"
context_size = 32768
parallel_slots = 1
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[bench]
tokenizer = "unsloth/Qwen3.5-9B-GGUF"
