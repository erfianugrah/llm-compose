name = "Qwen3.8 27B Dense - reasoning_effort medium, no spec (A/B v2)"
description = """
A/B variant of qwen38: identical except reasoning_effort = "medium".
Isolates the effort lever - all existing bench numbers are xhigh
(community-reported 15k-40k thinking tokens/prompt). If medium holds
task-suite quality at a fraction of the thinking tokens, it becomes
the preset default.
Hardlinked GGUF (presets dedup by model_id stem).
"""
vram_gb = 21.0

[model]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M-medium-nospec.gguf"

[mmproj]
file = "qwen38-mmproj.gguf"

[runtime]
reasoning = "on"
context_size = 196608
parallel_slots = 2
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
reasoning_effort = "medium"

[bench]
tokenizer = "unsloth/Qwen3.8-27B-GGUF"
