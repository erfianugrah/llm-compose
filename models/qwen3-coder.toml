name = "Qwen3 Coder 30B — coding, fast, direct"
description = """
Qwen3 Coder 30B A3B — MoE coding specialist, tool calling, non-thinking.
18.6 GB model (Q4_K_M). ~3.3B active params per token.
Best for: code generation, refactoring, agentic coding, fast iteration.
"""
vram_gb = 18.6

capabilities = ["code"]

[model]
repo = "prithivMLmods/Qwen3-Coder-30B-A3B-Instruct-GGUF"
file = "qwen3-coder-30b-a3b-instruct-q4_k_m.gguf"

[runtime]
context_size = 131072
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
# presence_penalty=1.5 recommended for Qwen3 non-thinking general tasks
presence_penalty = 1.5
repeat_penalty = 1.0
