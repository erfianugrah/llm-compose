name = "Qwen3.8 27B Dense - coding, vision, thinking (daily driver)"
description = """
Qwen3.8 27B Dense - daily driver, froggeric fixed template v22.3.

~17.1 GB model (Q4_K_M) + ~0.9 GB mmproj. 27B dense, hybrid
Gated DeltaNet + Gated Attention (64 layers), 262144 native ctx.
Sampling = model card thinking-mode recommendation
(temp 1.0 / top_p 0.95 / top_k 20 / min_p 0 / presence_penalty 0).

Template: froggeric/Qwen-Fixed-Chat-Templates v22.3 (2026-08-23).
Fixes empty-think poisoning, tool-call crash on JSON-string args,
mid-dialogue system-message drops, hallucinated user instructions
in thinking, and KV-preserving chronological thought.

context_size = 262144 (the model's native max) since 2026-08-26.

The old 196608 "hard ceiling" was a MEASUREMENT ARTIFACT, not a limit of
this model or GPU. The 2026-08-20 occupancy sweep ran while whisper-live
held ~4 GB of the same GPU (it eagerly loaded large-v3 at boot and never
released it), so every candidate above 196608 spilled out of VRAM and the
"14x collapse" was host-RAM fallback. Tell: the 245760 row recorded LOWER
vram_mib (28638) than the 196608 row (31632) while throughput dropped
100x - an allocation failure, which a kernel/graph limit cannot produce.

Measured KV cost is 45.1 KiB/token (65536 -> 25859 MiB vs 196608 -> 31632
MiB), so 196608 was already scraping the wall with ~50 MiB spare. After
whisper-live got lazy-load + idle-unload (whisper-transcribe
LIVE_MODEL_IDLE_TIMEOUT), 262144 measured 63.7 tok/s with the whole
whisper stack up (29699 MiB) and 27.7 tok/s at 230k real occupancy
(1302 tok/s prefill).

262144 is the model's native context_length - this is the true ceiling,
not a VRAM one. A bigger card would buy a larger quant or more slots,
not more context.

"""
vram_gb = 21.0

capabilities = ["vision", "code"]

[model]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M.gguf"

[mmproj]
file = "qwen38-mmproj.gguf"

[template]
file = "qwen38-fixed.jinja"

[runtime]
reasoning = "on"
context_size = 262144  # native max; see the note above re: the old 196608 artifact
parallel_slots = 1  # whole budget to one conversation (see above)
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
# spec: NONE. Both speculators degrade under agentic churn on this
# hybrid Gated DeltaNet model: MTP draft-mtp within ~10 min (upstream
# #27151/#27296), ngram-mod likewise (reproduced 2026-08-19, p6
# validation: 0.6-0.7 tok/s on task-suite churn, fresh-server probes
# fine, restart restores). Mechanism hypothesis: rejected-draft rollback
# of the recurrent state gets expensive at 24k+ context; only no-spec
# (no rollbacks) sustained 55-66 tok/s through a 5433s task.
reasoning_effort = "medium"  # adopted 2026-08-19: task suite A/B -
# all-pass on fast tasks with zero thinking binges (xhigh had a 1308s
# binge on a 19.7s task); ceiling tasks (t3/t6) fail identically at both
# efforts, so quality-neutral at 10-20x fewer thinking tokens.

[bench]
tokenizer = "unsloth/Qwen3.8-27B-GGUF"
