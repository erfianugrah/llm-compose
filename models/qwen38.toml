name = "Qwen3.8 27B Dense - coding, vision, thinking (eval candidate)"
description = """
Qwen3.8 27B Dense - eval candidate vs gemma4 / loop presets.
Plan: docs/plans/2026-08-15-local-model-bench-framework.md.

~17.1 GB model (Q4_K_M) + ~0.9 GB mmproj. 27B dense, hybrid
Gated DeltaNet + Gated Attention (64 layers), 262144 native ctx.
Sampling = model card thinking-mode recommendation
(temp 1.0 / top_p 0.95 / top_k 20 / min_p 0 / presence_penalty 0).

context_size set from P0 spike (2026-08-15): 196608 x 2 slots fits
# (re-verified with MTP on in the P4 spike: 31948 MiB)
at 31153 MiB (2x98304 effective per slot, ~1.4 GB headroom).
Arch support on llama.cpp b10362 confirmed; vision smoke passed.
(bench/p0-qwen38.sh, KV/ctx fit matrix) sets the final value.

"""
vram_gb = 21.0

[model]
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-Q4_K_M.gguf"

[mmproj]
file = "qwen38-mmproj.gguf"

[runtime]
reasoning = "on"
context_size = 196608
parallel_slots = 2
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
# MTP speculative decoding - adopted from the P4 spike (2026-08-17):
# gen +15.1%, pp +38.1%, TTFT -20%, fits 196608x2 at 31.9GB, S4 guard 4/4.
spec_type = "draft-mtp"

[bench]
tokenizer = "unsloth/Qwen3.8-27B-GGUF"
