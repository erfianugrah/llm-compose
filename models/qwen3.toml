name = "Qwen3 32B Dense — reasoning, tools, thinking"
description = """
Qwen3 32B — dense general-purpose, thinking mode, strong tool calling.
~20 GB model (Q4_K_M). 32B active params (dense).
Best for: research, science, daily questions, web search, tool use, reasoning.
"""
vram_gb = 20.0

[model]
repo = "ggml-org/Qwen3-32B-GGUF"
file = "Qwen3-32B-Q4_K_M.gguf"

[runtime]
reasoning = "on"
context_size = 40960
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
# presence_penalty=1.5 prevents Qwen3 repetition loops
presence_penalty = 1.5
repeat_penalty = 1.0
