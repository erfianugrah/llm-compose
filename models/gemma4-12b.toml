Gemma 4 12B Unified - small-track quality ceiling. Does NOT fit the 1070
with KV headroom; deploy-fit deferred to the planned 3080 Ti (plan 8.4).
Scored on quality only. reasoning off mirrors the gumshoe role.
"""
vram_gb = 8.5

capabilities = ["small"]

[model]
repo = "unsloth/gemma-4-12b-it-GGUF"
