# Bind-mount path registry — single source of truth for the host directories
# that compose + the orchestrator bind into containers.
#
# This file replaces the old "named Docker volume" model. Previously each
# entry created a Docker volume with `local` driver + `o=bind` indirection.
# On Docker Desktop / WSL2 that indirection rots after every Docker Desktop
# or WSL2 restart (Docker caches the bind through a hash path under
# `/run/desktop/mnt/host/wsl/docker-desktop-bind-mounts/<distro>/<hash>`
# which goes stale → "no such file or directory" at container start).
#
# Direct bind mounts have none of that fragility — the daemon resolves
# host paths every time a container starts, no metadata, no cache.
#
# `root` is the default parent. Each entry's `path` is relative to `root`
# unless it starts with `/`. `${HOME}` and other env vars are expanded
# at registry load time.
#
# Ensure all paths exist on disk:
#     python3 -m llmc volumes ensure
#
# List paths + disk usage:
#     python3 -m llmc volumes ls

root = "${HOME}/docker-volumes"

[volumes.llmc-state]
# Proxy state: active.toml, webui secret, swap locks
path = "state"

[volumes.llmc-llama-cache]
# HuggingFace cache (model downloads land here under .cache/huggingface)
path = "llama-server"

[volumes.llmc-llama-models]
# GGUFs, mmproj projections, jinja chat templates
path = "llama-server/models"

[volumes.llmc-comfyui-models]
# Diffusion checkpoints, LoRAs, VAE, upscalers (full tree)
path = "comfyui/models"

[volumes.llmc-comfyui-loras]
# LoRA destination subdir, mounted separately by lora-train so it can
# write trained adapters without rw on the whole models/ tree.
# Lives inside the comfyui/models tree so ComfyUI sees the new LoRA
# without any copy step.
path = "comfyui/models/loras"

[volumes.llmc-comfyui-output]
# Generated images and videos
path = "comfyui/output"

[volumes.llmc-comfyui-input]
# User-supplied inputs for img2img / video workflows
path = "comfyui/input"

[volumes.llmc-comfyui-custom-nodes]
# ComfyUI-Manager-installed nodes (survives container rebuild)
path = "comfyui/custom_nodes"

[volumes.llmc-comfyui-user]
# ComfyUI user data: workflows, settings, server state.
path = "comfyui/user"

[volumes.llmc-training-data]
# LoRA-training: datasets, configs, captions, raw images, output adapters.
path = "training-data"

[volumes.llmc-webui-data]
# Open WebUI state: SQLite DB, user accounts, chat history.
path = "webui"

[volumes.llmc-bench-cache]
# Benchmark eval outputs / cached runs.
path = "bench/cache"
