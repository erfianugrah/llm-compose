# Task-routing alias table. model: "auto" -> default, "auto:<name>" -> <name>.
# chain is ordered by preference; empty chain = "whatever is resident".
#
# Model roles:
#   qwen38 (Qwen3.8 27B)  -> coding
#   gemma4 (Gemma 4 31B)   -> generic tasks + writing
#   summarizer             -> MoE summarization
#   gemma4-12b             -> small/fast fallback

[default]
description = "generic tasks + writing: Gemma 4 if loaded, Qwen3.8 otherwise"
chain = ["gemma4", "qwen38"]

[code]
description = "coding: Qwen3.8"
chain = ["qwen38"]

[cheap]
description = "cheap tasks: summarizer then gemma4-12b"
chain = ["summarizer", "gemma4-12b"]

[resident]
description = "never swap: whatever is loaded"
chain = []
