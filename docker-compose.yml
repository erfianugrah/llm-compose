services:
  # ── GPU proxy ────────────────────────────────────────────────────────
  # Routes /v1/* → llama-server (LLM) and /comfyui/* → ComfyUI (image/video).
  # Only one GPU workload runs at a time — proxy manages lifecycle via
  # Docker socket and compose profiles. Also handles LLM model hot-swap.
  model-proxy:
    build:
      context: proxy
      dockerfile: Dockerfile
    image: erfianugrah/model-proxy:latest
    hostname: model-proxy
    container_name: model_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - LLAMA_HOST=llama-server
      - LLAMA_PORT=8080
      - COMFYUI_HOST=comfyui
      - COMFYUI_PORT=8188
      - PROXY_PORT=11434
      - PRESETS_DIR=/presets
      - PROJECT_DIR=/project
      - ASSETS_DIR=/assets
      - HEALTH_TIMEOUT=900
      # VRAM budget — reject model swaps that would exceed GPU memory.
      # LIMIT = total VRAM (RTX 5090 = 32 GB).
      # RESERVE = headroom for KV cache + CUDA overhead.
      # A preset loads only if VRAM_ESTIMATE_GB <= LIMIT − RESERVE.
      - VRAM_LIMIT_GB=32
      - VRAM_RESERVE_GB=6
      # Pass host HOME so docker compose inside proxy resolves ~ correctly
      - HOST_HOME=${HOME}
      # Project name must match the host compose project so the proxy
      # recreates llama-server on the existing network, not a new one
      - COMPOSE_PROJECT_NAME=llm-compose
    volumes:
      # Docker socket — needed to start/stop GPU services on mode/model swap
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Project dir — proxy reads .env and runs docker compose
      - .:/project:rw
      # Model presets (read-only)
      - ./models:/presets:ro
      # Models cache dir — proxy downloads mmproj/templates on demand
      - ${HOME}/docker-volumes/llama-server/models:/assets:rw
    # No depends_on for llama-server — it's profile-gated and started on
    # demand by the proxy. The proxy handles health polling internally.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      llm:
        ipv4_address: 172.28.0.4

  # ── LLM inference engine ─────────────────────────────────────────────
  # Model-agnostic — all config comes from .env (set by proxy or Makefile).
  # Not exposed to host; only reachable via the proxy on the llm network.
  # Profile-gated: only started by proxy or `make llm`. GPU is exclusive —
  # either llama-server or comfyui runs at a time, never both.
  llama-server:
    build:
      context: .
      dockerfile: llama-server.Dockerfile
    image: erfianugrah/llama-server:cuda12.8-sm120
    hostname: llama-server
    container_name: llama_server
    profiles: ["llm"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec llama-server \
          --hf-repo $${MODEL_REPO} \
          --hf-file $${MODEL_FILE} \
          $${MMPROJ_FILE:+--mmproj /models/$${MMPROJ_FILE}} \
          --jinja \
          $${TEMPLATE_FILE:+--chat-template-file /models/$${TEMPLATE_FILE}} \
          $${REASONING:+--reasoning $${REASONING}} \
          --port 8080 \
          --host 0.0.0.0 \
          -ngl 99 \
          --flash-attn on \
          -ctk q8_0 \
          -ctv q8_0 \
          -c $${CONTEXT_SIZE:-65536} \
          --fit on \
          --fit-ctx 32768 \
          --temp $${TEMPERATURE:-1.0} \
          --top-p $${TOP_P:-0.95} \
          --top-k $${TOP_K:-64} \
          $${MIN_P:+--min-p $${MIN_P}} \
          $${PRESENCE_PENALTY:+--presence-penalty $${PRESENCE_PENALTY}} \
          $${REPEAT_PENALTY:+--repeat-penalty $${REPEAT_PENALTY}} \
          -np 1 \
          -b 4096 \
          -ub 4096 \
          --threads 8 \
          --threads-batch 8 \
          -v \
          --metrics
    environment:
      - MODEL_REPO=${MODEL_REPO}
      - MODEL_FILE=${MODEL_FILE}
      - MMPROJ_FILE=${MMPROJ_FILE}
      - TEMPLATE_FILE=${TEMPLATE_FILE}
      - REASONING=${REASONING}
      - CONTEXT_SIZE=${CONTEXT_SIZE}
      - TEMPERATURE=${TEMPERATURE}
      - TOP_P=${TOP_P}
      - TOP_K=${TOP_K}
      - MIN_P=${MIN_P}
      - PRESENCE_PENALTY=${PRESENCE_PENALTY}
      - REPEAT_PENALTY=${REPEAT_PENALTY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    shm_size: "2g"
    volumes:
      - ~/docker-volumes/llama-server:/root/.cache
      - ~/docker-volumes/llama-server/models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      llm:
        ipv4_address: 172.28.0.2

  # ── Image / video generation engine ─────────────────────────────────
  # ComfyUI node-based workflow engine for Stable Diffusion, Flux, etc.
  # Profile-gated: only started by proxy or `make comfyui`. GPU is exclusive —
  # either llama-server or comfyui runs at a time, never both.
  comfyui:
    build:
      context: .
      dockerfile: comfyui.Dockerfile
    image: erfianugrah/comfyui:cuda12.8-sm120
    hostname: comfyui
    container_name: comfyui
    profiles: ["comfyui"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    shm_size: "4g"
    volumes:
      - ~/docker-volumes/comfyui/models:/app/ComfyUI/models
      - ~/docker-volumes/comfyui/output:/app/ComfyUI/output
      - ~/docker-volumes/comfyui/input:/app/ComfyUI/input
      - ~/docker-volumes/comfyui/custom_nodes:/app/ComfyUI/custom_nodes
      - ~/docker-volumes/comfyui/user:/app/ComfyUI/user
    ports:
      - "127.0.0.1:8188:8188"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    # No cap_drop: ComfyUI needs DAC_OVERRIDE to write output/custom_nodes
    # dirs that may be owned by host UID. Also, custom nodes may compile
    # C extensions at runtime (SageAttention, insightface, etc.).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      llm:
        ipv4_address: 172.28.0.5

  # ── Chat UI ──────────────────────────────────────────────────────────
  # Open WebUI's image uses UID 1000. We set user: explicitly so files
  # created on the bind-mount are owned by the host user, not root.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.12
    hostname: open_webui
    container_name: open_webui
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Data directory — must match the volume mount
      - DATA_DIR=/app/backend/data
      # Open WebUI connects via the proxy (which forwards to llama-server)
      - OPENAI_API_BASE_URL=http://172.28.0.4:11434/v1
      - OPENAI_API_KEY=not-needed
      - OLLAMA_BASE_URL=
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=true
      - SCARF_NO_ANALYTICS=true
      # Branding and defaults
      - WEBUI_NAME=llama.cpp
      - DEFAULT_MODELS=Qwen3.5-27B-Q4_K_M
      - ENABLE_PERSISTENT_CONFIG=false
      - 'DEFAULT_MODEL_PARAMS={"function_calling":"native","temperature":0.6,"top_p":0.95,"top_k":20}'
      - DEFAULT_PROMPT_SUGGESTIONS=[]
      - ENABLE_SIGNUP=false
      # Image generation via ComfyUI (routed through the proxy)
      - COMFYUI_BASE_URL=http://172.28.0.4:11434/comfyui/
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=comfyui
      # Headless admin — set in .env or leave blank for browser signup
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME:-Admin}
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ~/docker-volumes/webui:/app/backend/data
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    depends_on:
      model-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      llm:
        ipv4_address: 172.28.0.3

networks:
  llm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
