# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
# llm-compose v2 stack — proxy.
#
# GPU services (llama-server, comfyui, lora-train) are NOT in this file.
# The proxy spawns them on-demand via the Docker Engine API and labels
# them with llmc.mode so it can find them again after a restart.
#
# Bind mounts go directly from host paths to container paths — no Docker
# named-volume indirection. The host path layout lives in volumes.toml
# (single source of truth for both compose + the orchestrator). `llmc
# volumes ensure` creates any missing directories. Direct binds eliminate
# the Docker-Desktop-on-WSL2 snapshot rot that hit the named-volume model.
#
# Vars compose needs at parse time:
#   - HOME (always set on Linux/WSL2) — used to compose bind sources

services:
  # ── Mode-switching reverse proxy ───────────────────────────────────
  # Routes /v1/* → llama-server, /comfyui/* → comfyui, /train/* → lora-train.
  # Spawns each GPU service via Docker SDK when its route is hit; stops
  # the previous one first (mutual exclusion on a single GPU).
  # model-proxy (Python): LEGACY since 2026-08-19, kept for rollback only.
  # Behind the 'rollback' profile so `make up` / `docker compose up -d` never
  # starts it. Rollback: swap the two published ports (11434 <-> 11436),
  # `docker compose --profile rollback up -d model-proxy`, restart proxy.
  model-proxy:
    profiles: ["rollback"]
    build:
      context: .
      dockerfile: images/proxy.Dockerfile
    image: erfianugrah/llmc-proxy:v2
    container_name: model_proxy
    hostname: model-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:11436:11434"
    environment:
      LLMC_NETWORK: llmc
      # Host's HOME used by volumes.toml's ${HOME}-relative bind paths.
      # The proxy container itself runs as root (HOME=/root by default);
      # we override so the orchestrator resolves volumes.toml against the
      # host filesystem layout when spawning GPU services via the Docker
      # SDK (daemon binds host paths into the new container).
      HOME: ${HOME:?HOME must be set in compose runtime env}
      # Other config keys (presets dir, state dir, vram budget) have
      # sane defaults baked into the image. See images/proxy.Dockerfile.
    volumes:
      # Docker socket — orchestrator's only privileged dependency.
      # `:ro` is theatre (Docker daemon doesn't enforce read-only on the
      # socket; clients can still POST). Kept anyway for the defense-in-depth
      # signal.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Repo's models/ dir mounted read-only as /presets so adding a new
      # preset is just `git pull` (or editor save) — no image rebuild,
      # no proxy restart (presets are live-reloaded on /v1/models).
      - ./models:/presets:ro
      # volumes.toml mounted read-only so the proxy's orchestrator can
      # resolve logical volume names → host paths when spawning GPU
      # services via the Docker SDK (the daemon binds those paths into
      # the new container).
      - ./volumes.toml:/volumes.toml:ro
      # State (active.toml) and assets (mmproj/template downloads).
      # Both are direct binds — host paths from volumes.toml.
      - ${HOME}/docker-volumes/state:/state
      - ${HOME}/docker-volumes/llama-server/models:/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - llmc
    # Note: previously pinned to a static IP (172.29.0.4) so the WebUI's
    # env-baked URL didn't depend on Docker's embedded DNS. With the v2
    # network isolated from other stacks, DNS resolves consistently —
    # the WebUI just uses http://model-proxy:11434 by hostname. If DNS
    # ever flakes (e.g. external networks attached via overlay), reinstate
    # the static IP and update OPENAI_API_BASE_URL / COMFYUI_BASE_URL.

  # ── Go proxy (proxy-v2 soak, spec R6) ─────────────────────────────
  # Side-by-side with the Python proxy on 127.0.0.1:11435, same presets and
  # volumes, but its OWN state dir (docker-volumes/state-go) so the two
  # proxies never fight over active.toml. Cutover = repoint clients to
  # :11435; rollback = repoint to :11434.
  model-proxy-go:
    build:
      context: .
      dockerfile: images/proxy-go.Dockerfile
    image: erfianugrah/llmc-proxy-go:v1
    container_name: model_proxy_go
    hostname: model-proxy-go
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      LLMC_NETWORK: llmc
      HOME: ${HOME:?HOME must be set in compose runtime env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./models:/presets:ro
      - ./routes.toml:/routes.toml:ro
      - ./volumes.toml:/volumes.toml:ro
      - ${HOME}/docker-volumes/state-go:/state
      - ${HOME}/docker-volumes/llama-server/models:/assets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11434/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - llmc


# ── Network ──────────────────────────────────────────────────────────
# `name: llmc` overrides Docker compose's default project-prefixed name
# (would otherwise be `llm-compose_llmc`). The proxy spawns GPU services
# onto this network by name, so an unprefixed name keeps that simple.
networks:
  llmc:
    name: llmc
    driver: bridge
    ipam:
      config:
        # 172.29.x subnet. whisper-transcribe (sister stack) joins this
        # same network by name via `external: true, name: llmc` — do not
        # renumber without updating that repo's compose.yaml too.
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

# Note: no `volumes:` section — all mounts are direct host-path binds.
# The host directory layout lives in volumes.toml. `llmc volumes ensure`
# creates any missing directories before the stack starts.
